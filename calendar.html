<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGCSE Study Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .event-scroll::-webkit-scrollbar { width: 4px; }
        .event-scroll::-webkit-scrollbar-track { background: transparent; }
        .event-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden">

    <aside class="w-full md:w-80 bg-white h-full shadow-lg z-10 flex flex-col border-r border-slate-200 flex-shrink-0">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <div>
                <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-indigo-600 transition-colors mb-2 font-medium">
                    <i class="fas fa-arrow-left"></i> Back to Hub
                </a>
                <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                    <i class="fas fa-graduation-cap"></i> IGCSE Tracker
                </h1>
                <p class="text-xs text-slate-500 mt-1">Manage lessons & study time</p>
            </div>
        </div>

        <div class="p-6 flex-1 overflow-y-auto hide-scrollbar">
            <div class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">My Subjects</h2>
                    <button id="openCourseModalBtn" class="text-indigo-500 hover:text-indigo-700 transition-colors" title="Add Subject">
                        <i class="fas fa-plus-circle text-lg"></i>
                    </button>
                </div>
                <div id="courseList" class="space-y-3"></div>
            </div>

            <div>
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Upcoming Next 7 Days</h2>
                <div id="upcomingEventsList" class="space-y-3"></div>
            </div>
        </div>
        
        <div class="p-4 border-t border-slate-100 bg-slate-50">
            <button id="openEventModalBtnGlobal" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm">
                <i class="fas fa-calendar-plus"></i> Schedule Session
            </button>
        </div>
    </aside>

    <main class="flex-1 h-full flex flex-col bg-slate-50 min-w-0">
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-col sm:flex-row items-center justify-between shadow-sm z-0">
            <div class="flex items-center gap-4 mb-4 sm:mb-0">
                <h2 id="currentMonthYear" class="text-2xl font-bold text-slate-800 w-48 text-center sm:text-left">Month Year</h2>
                <div class="flex bg-slate-100 rounded-lg p-1">
                    <button id="prevMonthBtn" class="p-1.5 px-3 rounded text-slate-600 hover:bg-white hover:shadow-sm transition-all"><i class="fas fa-chevron-left"></i></button>
                    <button id="todayBtn" class="p-1.5 px-3 rounded text-sm font-medium text-slate-600 hover:bg-white hover:shadow-sm transition-all">Today</button>
                    <button id="nextMonthBtn" class="p-1.5 px-3 rounded text-slate-600 hover:bg-white hover:shadow-sm transition-all"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="flex gap-2 text-sm text-slate-600">
                <span class="flex items-center gap-1.5 bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm"><i class="fas fa-chalkboard-teacher text-blue-500"></i> Lesson</span>
                <span class="flex items-center gap-1.5 bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm"><i class="fas fa-book-open text-orange-500"></i> Study</span>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-4 md:p-6 flex flex-col min-h-0">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col min-w-[700px]">
                <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50 rounded-t-xl">
                    <div class="py-3 text-center text-xs font-semibold text-slate-500 uppercase">Sun</div>
                    <div class="py-3 text-center text-xs font-semibold text-slate-500 uppercase">Mon</div>
                    <div class="py-3 text-center text-xs font-semibold text-slate-500 uppercase">Tue</div>
                    <div class="py-3 text-center text-xs font-semibold text-slate-500 uppercase">Wed</div>
                    <div class="py-3 text-center text-xs font-semibold text-slate-500 uppercase">Thu</div>
                    <div class="py-3 text-center text-xs font-semibold text-slate-500 uppercase">Fri</div>
                    <div class="py-3 text-center text-xs font-semibold text-slate-500 uppercase">Sat</div>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 flex-1 auto-rows-fr bg-slate-200 gap-[1px]"></div>
            </div>
        </div>
    </main>

    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <!-- Add Subject Modal -->
        <div id="courseModal" class="bg-white rounded-xl shadow-xl w-full max-w-md hidden flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-semibold text-lg text-slate-800">Add IGCSE Subject</h3>
                <button class="close-modal text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6">
                <form id="courseForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Subject Name</label>
                        <input type="text" id="courseName" required placeholder="e.g., Extended Math 0580" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Subject Color</label>
                        <div class="flex gap-3 flex-wrap" id="colorPicker"></div>
                        <input type="hidden" id="selectedColor" value="bg-blue-500" required>
                    </div>
                    <div class="pt-4 flex justify-end gap-3">
                        <button type="button" class="close-modal px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium">Cancel</button>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium">Save Subject</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Add Event Modal -->
        <div id="eventModal" class="bg-white rounded-xl shadow-xl w-full max-w-md hidden flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-semibold text-lg text-slate-800">Schedule Session</h3>
                <button class="close-modal text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6">
                <div id="eventModalError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-xs font-medium"></div>
                <form id="eventForm" class="space-y-4">
                    <input type="hidden" id="eventDate">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Session Type</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="cursor-pointer">
                                <input type="radio" name="eventType" value="lesson" class="peer sr-only" checked>
                                <div class="rounded-lg border border-slate-200 px-4 py-2.5 text-center hover:bg-slate-50 peer-checked:border-blue-500 peer-checked:bg-blue-50 peer-checked:text-blue-700 flex items-center justify-center gap-2">
                                    <i class="fas fa-chalkboard-teacher"></i> Lesson
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="eventType" value="study" class="peer sr-only">
                                <div class="rounded-lg border border-slate-200 px-4 py-2.5 text-center hover:bg-slate-50 peer-checked:border-orange-500 peer-checked:bg-orange-50 peer-checked:text-orange-700 flex items-center justify-center gap-2">
                                    <i class="fas fa-book-open"></i> Study
                                </div>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Subject</label>
                        <select id="eventCourse" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Start Time</label>
                            <input type="time" id="eventStartTime" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">End Time</label>
                            <input type="time" id="eventEndTime" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Notes / Topics (Optional)</label>
                        <input type="text" id="eventNotes" placeholder="e.g., Past paper 2022, Cell structure..." class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <div class="pt-4 flex justify-end gap-3">
                        <button type="button" class="close-modal px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium">Cancel</button>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium">Add to Calendar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Custom Notification Modal (Alert replacement) -->
        <div id="noticeModal" class="bg-white rounded-xl shadow-xl w-full max-w-sm hidden flex-col p-6 text-center">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-xl mx-auto mb-3">
                <i class="fas fa-info-circle"></i>
            </div>
            <h3 id="noticeTitle" class="font-bold text-slate-800 text-lg mb-2">Notice</h3>
            <p id="noticeMessage" class="text-slate-600 text-sm mb-5"></p>
            <button id="noticeOkBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded-lg w-full">OK</button>
        </div>

        <!-- Custom Confirm Modal (Confirm replacement) -->
        <div id="confirmModal" class="bg-white rounded-xl shadow-xl w-full max-w-sm hidden flex-col p-6 text-center">
            <div class="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center text-xl mx-auto mb-3">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 id="confirmTitle" class="font-bold text-slate-800 text-lg mb-2">Are you sure?</h3>
            <p id="confirmMessage" class="text-slate-600 text-sm mb-5"></p>
            <div class="flex gap-3">
                <button id="confirmCancelBtn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-lg">Cancel</button>
                <button id="confirmYesBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded-lg">Delete</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COURSES = 'igcse_courses_v1';
        const STORAGE_KEY_EVENTS = 'igcse_events_v1';

        const colors = [
            'bg-red-500', 'bg-orange-500', 'bg-amber-500', 'bg-green-500', 
            'bg-emerald-500', 'bg-teal-500', 'bg-cyan-500', 'bg-blue-500', 
            'bg-indigo-500', 'bg-violet-500', 'bg-purple-500', 'bg-fuchsia-500', 'bg-pink-500'
        ];

        const defaultCourses = [
            { id: 'c1', name: 'Math (0580)', color: 'bg-blue-500' },
            { id: 'c2', name: 'Biology (0610)', color: 'bg-green-500' },
            { id: 'c3', name: 'Physics (0625)', color: 'bg-purple-500' }
        ];

        let courses = JSON.parse(localStorage.getItem(STORAGE_KEY_COURSES));
        if (!courses || courses.length === 0) {
            courses = [...defaultCourses];
            saveCourses();
        }

        let events = JSON.parse(localStorage.getItem(STORAGE_KEY_EVENTS)) || [];
        let currentDate = new Date();
        let confirmCallback = null;

        const currentMonthYearEl = document.getElementById('currentMonthYear');
        const calendarGridEl = document.getElementById('calendarGrid');
        const courseListEl = document.getElementById('courseList');
        const upcomingEventsListEl = document.getElementById('upcomingEventsList');
        
        const modalOverlay = document.getElementById('modalOverlay');
        const courseModal = document.getElementById('courseModal');
        const eventModal = document.getElementById('eventModal');
        const noticeModal = document.getElementById('noticeModal');
        const confirmModal = document.getElementById('confirmModal');

        function saveCourses() { localStorage.setItem(STORAGE_KEY_COURSES, JSON.stringify(courses)); }
        function saveEvents() { localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(events)); }
        function generateId() { return Math.random().toString(36).substr(2, 9); }
        function getCourseById(id) { return courses.find(c => c.id === id); }
        
        function formatTime(timeStr) {
            const [hours, minutes] = timeStr.split(':');
            const h = parseInt(hours);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return `${h12}:${minutes} ${ampm}`;
        }

        // Custom non-blocking modal helpers
        function showNotice(title, message) {
            document.getElementById('noticeTitle').textContent = title;
            document.getElementById('noticeMessage').textContent = message;
            openModal(noticeModal);
        }

        function showConfirm(title, message, onYes) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            confirmCallback = onYes;
            openModal(confirmModal);
        }

        document.getElementById('noticeOkBtn').onclick = closeModal;
        document.getElementById('confirmCancelBtn').onclick = closeModal;
        document.getElementById('confirmYesBtn').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeModal();
        };

        function updateUI() {
            renderCourses();
            renderCalendar();
            renderUpcomingEvents();
            populateCourseSelect();
        }

        function renderCourses() {
            courseListEl.innerHTML = '';
            if (courses.length === 0) {
                courseListEl.innerHTML = '<p class="text-sm text-slate-500 italic">No subjects added yet.</p>';
                return;
            }

            courses.forEach(course => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-2.5 bg-white border border-slate-100 rounded-lg shadow-sm group hover:shadow-md transition-all';
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-4 h-4 rounded-full shadow-sm flex-shrink-0 ${course.color}"></div>
                        <span class="font-medium text-sm text-slate-700 truncate">${course.name}</span>
                    </div>
                    <button class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all flex-shrink-0" onclick="deleteCourse('${course.id}')" title="Remove Subject">
                        <i class="fas fa-trash-alt text-xs"></i>
                    </button>
                `;
                courseListEl.appendChild(div);
            });
        }

        function renderCalendar() {
            calendarGridEl.innerHTML = '';
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            currentMonthYearEl.textContent = `${monthNames[month]} ${year}`;
            
            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            const today = new Date();
            const isCurrentMonth = (today.getFullYear() === year && today.getMonth() === month);

            let dayNodes = [];
            for (let x = firstDayIndex; x > 0; x--) {
                dayNodes.push(createDayCell(year, month - 1, prevMonthLastDay - x + 1, true));
            }
            for (let i = 1; i <= lastDay; i++) {
                dayNodes.push(createDayCell(year, month, i, false, isCurrentMonth && (i === today.getDate())));
            }
            const remainingCells = 42 - dayNodes.length;
            for(let j = 1; j <= remainingCells; j++) {
                dayNodes.push(createDayCell(year, month + 1, j, true));
            }

            dayNodes.forEach(node => calendarGridEl.appendChild(node));
        }

        function createDayCell(year, month, day, isFaded, isToday = false) {
            let realYear = year, realMonth = month;
            if (month < 0) { realMonth = 11; realYear--; }
            else if (month > 11) { realMonth = 0; realYear++; }
            
            const dateStr = `${realYear}-${String(realMonth+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const cell = document.createElement('div');
            cell.className = `bg-white min-h-[100px] p-2 flex flex-col transition-colors group relative ${isFaded ? 'bg-slate-50 text-slate-400' : 'text-slate-700'}`;
            
            const header = document.createElement('div');
            header.className = 'flex justify-between items-start mb-1';
            
            const dayNum = document.createElement('span');
            dayNum.className = `text-sm font-medium w-7 h-7 flex items-center justify-center rounded-full ${isToday ? 'bg-indigo-600 text-white shadow-md' : ''}`;
            dayNum.textContent = day;
            
            const addBtn = document.createElement('button');
            addBtn.className = 'text-indigo-400 hover:text-indigo-600 hover:bg-indigo-50 w-6 h-6 rounded flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all';
            addBtn.innerHTML = '<i class="fas fa-plus text-xs"></i>';
            addBtn.onclick = (e) => { e.stopPropagation(); openEventModal(dateStr); };

            header.appendChild(dayNum);
            header.appendChild(addBtn);
            cell.appendChild(header);
            cell.ondblclick = () => openEventModal(dateStr);

            const eventsContainer = document.createElement('div');
            eventsContainer.className = 'flex-1 overflow-y-auto event-scroll space-y-1 mt-1 pr-1';
            
            const dayEvents = events.filter(e => e.date === dateStr).sort((a, b) => a.startTime.localeCompare(b.startTime));
            
            dayEvents.forEach(evt => {
                const course = getCourseById(evt.courseId);
                if(!course) return;
                
                const evtEl = document.createElement('div');
                const isLesson = evt.type === 'lesson';
                const icon = isLesson ? 'fa-chalkboard-teacher' : 'fa-book-open';
                
                evtEl.className = `text-xs p-1.5 rounded-md ${course.color} text-white shadow-sm flex flex-col gap-0.5 cursor-pointer hover:opacity-90 relative group/evt`;
                evtEl.innerHTML = `
                    <div class="flex justify-between items-center font-medium leading-tight">
                        <div class="flex items-center gap-1 overflow-hidden">
                            <i class="fas ${icon} text-[10px] opacity-80"></i>
                            <span class="truncate">${course.name.substring(0,10)}...</span>
                        </div>
                        <span class="text-[9px] opacity-90">${formatTime(evt.startTime)}</span>
                    </div>
                    ${evt.notes ? `<div class="text-[10px] opacity-90 truncate leading-tight">${evt.notes}</div>` : ''}
                    <button class="absolute top-1 right-1 w-4 h-4 bg-red-600 rounded text-white hidden group-hover/evt:flex items-center justify-center hover:bg-red-700" onclick="deleteEvent(event, '${evt.id}')">
                        <i class="fas fa-times text-[8px]"></i>
                    </button>
                `;
                eventsContainer.appendChild(evtEl);
            });

            cell.appendChild(eventsContainer);
            return cell;
        }

        function renderUpcomingEvents() {
            upcomingEventsListEl.innerHTML = '';
            const today = new Date();
            today.setHours(0,0,0,0);
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);

            let upcoming = events.filter(e => {
                const evDate = new Date(e.date);
                return evDate >= today && evDate <= nextWeek;
            }).sort((a, b) => a.date === b.date ? a.startTime.localeCompare(b.startTime) : a.date.localeCompare(b.date));

            if (upcoming.length === 0) {
                upcomingEventsListEl.innerHTML = '<p class="text-sm text-slate-500 italic">No events scheduled.</p>';
                return;
            }

            let currentDisplayDate = '';
            upcoming.forEach(evt => {
                const course = getCourseById(evt.courseId);
                if(!course) return;

                if (currentDisplayDate !== evt.date) {
                    currentDisplayDate = evt.date;
                    const dateHeader = document.createElement('div');
                    dateHeader.className = 'text-xs font-semibold text-slate-500 mt-3 mb-1 uppercase tracking-wide';
                    dateHeader.textContent = new Date(currentDisplayDate).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                    upcomingEventsListEl.appendChild(dateHeader);
                }

                const item = document.createElement('div');
                item.className = 'flex items-stretch bg-white border border-slate-100 rounded-lg shadow-sm overflow-hidden';
                const isLesson = evt.type === 'lesson';
                item.innerHTML = `
                    <div class="w-1.5 ${course.color} flex-shrink-0"></div>
                    <div class="p-2.5 flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-0.5">
                            <span class="font-semibold text-sm text-slate-700 truncate block">${course.name}</span>
                            <span class="text-xs font-medium text-slate-500 whitespace-nowrap ml-2">${formatTime(evt.startTime)}</span>
                        </div>
                        <div class="flex items-center gap-1.5 text-xs text-slate-500">
                            <i class="fas ${isLesson ? 'fa-chalkboard-teacher text-blue-600' : 'fa-book-open text-orange-600'}"></i>
                            <span class="truncate">${evt.notes || (isLesson ? 'Lesson' : 'Study')}</span>
                        </div>
                    </div>
                `;
                upcomingEventsListEl.appendChild(item);
            });
        }

        function openModal(modalEl) {
            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('flex');
            [courseModal, eventModal, noticeModal, confirmModal].forEach(m => m.classList.add('hidden'));
            modalEl.classList.remove('hidden');
            modalEl.classList.add('flex');
        }

        function closeModal() {
            modalOverlay.classList.add('hidden');
            modalOverlay.classList.remove('flex');
        }

        modalOverlay.addEventListener('mousedown', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.querySelectorAll('.close-modal').forEach(btn => btn.addEventListener('click', closeModal));

        const colorPickerContainer = document.getElementById('colorPicker');
        const selectedColorInput = document.getElementById('selectedColor');
        
        colors.forEach(color => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `w-8 h-8 rounded-full shadow-sm ring-2 ring-offset-2 ring-transparent hover:scale-110 ${color}`;
            btn.onclick = () => {
                Array.from(colorPickerContainer.children).forEach(c => c.classList.replace('ring-slate-400', 'ring-transparent'));
                btn.classList.replace('ring-transparent', 'ring-slate-400');
                selectedColorInput.value = color;
            };
            colorPickerContainer.appendChild(btn);
        });
        if(colorPickerContainer.firstChild) {
            colorPickerContainer.firstChild.classList.replace('ring-transparent', 'ring-slate-400');
        }

        document.getElementById('openCourseModalBtn').onclick = () => {
            document.getElementById('courseForm').reset();
            openModal(courseModal);
        };

        document.getElementById('courseForm').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('courseName').value.trim();
            const color = selectedColorInput.value;
            if(name) {
                courses.push({ id: generateId(), name, color });
                saveCourses();
                updateUI();
                closeModal();
            }
        };

        window.deleteCourse = function(id) {
            showConfirm('Remove Subject', 'Are you sure you want to remove this subject? Associated events will be hidden.', () => {
                courses = courses.filter(c => c.id !== id);
                events = events.filter(e => e.courseId !== id);
                saveCourses();
                saveEvents();
                updateUI();
            });
        };

        function populateCourseSelect() {
            const select = document.getElementById('eventCourse');
            select.innerHTML = '<option value="" disabled selected>Select a subject...</option>';
            courses.forEach(c => { select.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
        }

        function openEventModal(dateStr = null) {
            if (courses.length === 0) {
                showNotice("Subject Required", "Please add at least one subject before scheduling a session.");
                return;
            }
            document.getElementById('eventModalError').classList.add('hidden');
            document.getElementById('eventForm').reset();
            if(!dateStr) {
                const today = new Date();
                dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            }
            document.getElementById('eventDate').value = dateStr;
            openModal(eventModal);
        }

        document.getElementById('openEventModalBtnGlobal').onclick = () => openEventModal();

        document.getElementById('eventForm').onsubmit = (e) => {
            e.preventDefault();
            const date = document.getElementById('eventDate').value;
            const courseId = document.getElementById('eventCourse').value;
            const type = document.querySelector('input[name="eventType"]:checked').value;
            const startTime = document.getElementById('eventStartTime').value;
            const endTime = document.getElementById('eventEndTime').value;
            const notes = document.getElementById('eventNotes').value.trim();
            const errorEl = document.getElementById('eventModalError');

            if (!courseId) {
                errorEl.textContent = 'Please select a subject.';
                errorEl.classList.remove('hidden');
                return;
            }
            if (startTime >= endTime) {
                errorEl.textContent = 'End time must be after start time.';
                errorEl.classList.remove('hidden');
                return;
            }

            events.push({ id: generateId(), date, courseId, type, startTime, endTime, notes });
            saveEvents();
            updateUI();
            closeModal();
        };

        window.deleteEvent = function(e, id) {
            e.stopPropagation();
            showConfirm('Delete Session', 'Are you sure you want to delete this session?', () => {
                events = events.filter(evt => evt.id !== id);
                saveEvents();
                updateUI();
            });
        };

        document.getElementById('prevMonthBtn').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
        document.getElementById('nextMonthBtn').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };
        document.getElementById('todayBtn').onclick = () => { currentDate = new Date(); renderCalendar(); };

        updateUI();
    </script>
</body>
</html>
